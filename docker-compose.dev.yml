services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai123
      POSTGRES_DB: genai_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./server
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    depends_on:
      - db

volumes:
  postgres_data:

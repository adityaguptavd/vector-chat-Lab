services:

  db:
    image: postgres:16
    container_name: genai-postgres
    environment:
      POSTGRES_USER: genai
      POSTGRES_PASSWORD: genai123
      POSTGRES_DB: genai_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./server
    container_name: genai-backend
    env_file:
      - ./server/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    restart: always

volumes:
  postgres_data:
